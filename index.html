<!doctype html>
<!-- uTools 插件应用 HTML 入口：构建后位于 dist/index.html，由 uTools 从插件本地目录加载
     （发布环境不允许请求网络资源，所有资源都必须是本地文件）。

     本文件只承担“外壳”职责，不含业务逻辑。三条硬约束：
       1. 样式只用 src/main.css 中的语义类（bg-canvas、text-ink 等），禁止硬编码色值，
          否则切换深色主题时会出现局部颜色不跟随；
       2. 入口脚本必须保留 type="module" 且位于 body 末尾，src 保留前导斜杠写法
          （Vite 据此解析并重写为 dist 下的资源引用），否则打包或本地加载会失败；
       3. 修改本文件后必须重新执行 vite build，dist 才会同步更新。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Manager</title>
  </head>
  <!-- body 承担全局排版：m-0 清除默认外边距、overflow-hidden 禁止整页滚动、text-sm/antialiased 统一字号与抗锯齿 -->
  <body
    class="m-0 overflow-hidden bg-canvas font-sans text-sm text-ink antialiased"
  >
    <!-- Vue 应用挂载点：h-screen 撑满插件窗口高度，min-w-155（620px）保证窗口变窄时布局不塌陷 -->
    <div id="app" class="h-screen min-w-155"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
